name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Run only the latest commit per branch / PR — older runs get cancelled
# when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + unit + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabswirl-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error
